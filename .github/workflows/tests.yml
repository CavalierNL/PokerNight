name: Tests

# De deploy-workflow test pas ná publicatie. Deze draait op elke andere branch
# en op elke pull request, zodat een padfout of een gebroken bundel al vóór de
# merge zichtbaar is in plaats van pas op de live site.
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Zonder PAGE_URL bouwt Playwright zelf en test tegen een previewserver,
      # met dezelfde base als GitHub Pages gebruikt.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: error
          retention-days: 7
