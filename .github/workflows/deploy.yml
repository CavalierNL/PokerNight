name: Deploy naar GitHub Pages

# Publiceert naar de `gh-pages`-branch en niet meer via actions/deploy-pages.
# Reden: Pages kent één bron, en previews per PR vragen om submappen op die
# branch (zie preview.yml). Gevolg: GitHub draait na onze push zijn eigen
# buildstap, dus de site staat er later op dan bij een Actions-deploy. Daar is
# de rooktest onderaan op gerekend.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Dezelfde groepsnaam als in preview.yml, zodat een deploy en een preview elkaar
# niet gelijktijdig naar `gh-pages` proberen te duwen. Botsen ze alsnog — de
# groepen zijn per PR — dan vangt de rebase-lus in "Push naar gh-pages" dat op.
concurrency:
  group: gh-pages-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Nodig om naar gh-pages te kunnen pushen.
      contents: write
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # De rooktest tegen een eigen previewserver, vóór publicatie. De variant
      # onderaan draait tegen de echte site en is daarmee pas ná de deploy; deze
      # houdt een gebroken bundel of een verkeerde base van de site af.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-vooraf
          path: |
            playwright-report
            test-results
          if-no-files-found: error
          retention-days: 7

      - name: Haal gh-pages op of maak hem aan
        id: gh-pages
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            echo "bestaat=true" >> "$GITHUB_OUTPUT"
          else
            ls_exit=$?
            # Exitcode 2 is "geen match gevonden"; al het andere is een echte
            # fout en mag niet als "branch bestaat nog niet" gelezen worden.
            if [ $ls_exit -eq 2 ]; then
              echo "bestaat=false" >> "$GITHUB_OUTPUT"
              mkdir -p gh-pages && cd gh-pages
              git init -b gh-pages
              git remote add origin "${REPO_URL}"
            else
              echo "::error::git ls-remote mislukte met exitcode ${ls_exit}"
              exit 1
            fi
          fi

      - uses: actions/checkout@v4
        if: steps.gh-pages.outputs.bestaat == 'true'
        with:
          ref: gh-pages
          path: gh-pages

      - name: Zet de nieuwe site in de root
        run: |
          # De previews van openstaande PR's staan op dezelfde branch en mogen
          # niet meegewist worden; zonder deze omweg haalt het leegmaken
          # hieronder ze weg en is elke preview-URL dood tot de PR opnieuw pusht.
          if [ -d gh-pages/pr-preview ]; then
            mv gh-pages/pr-preview /tmp/pr-preview-bewaard
          fi
          find gh-pages -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          cp -r dist/. gh-pages/
          if [ -d /tmp/pr-preview-bewaard ]; then
            mv /tmp/pr-preview-bewaard gh-pages/pr-preview
          fi

      - name: Push naar gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Niets veranderd aan de site"
            exit 0
          fi
          git commit -m "Publiceer ${GITHUB_SHA}"
          gelukt=false
          for poging in 1 2 3; do
            if git push origin gh-pages; then
              gelukt=true
              break
            fi
            echo "::warning::Push mislukt (poging ${poging}/3), rebasen en opnieuw"
            if ! git pull --rebase origin gh-pages; then
              echo "::error::git pull --rebase mislukte op poging ${poging}/3"
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
          done
          if [ "$gelukt" != "true" ]; then
            echo "::error::Push naar gh-pages mislukt na 3 pogingen"
            exit 1
          fi

  # Draait tegen de zojuist gepubliceerde site. Let op de volgorde: dit gebeurt
  # ná publicatie, dus het houdt een kapotte deploy niet tegen — het maakt hem
  # zichtbaar in plaats van stil, iets wat de unit tests niet kunnen.
  rooktest:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # De URL kwam eerder uit actions/deploy-pages; die output bestaat niet meer
      # nu we naar een branch publiceren, dus stellen we hem zelf samen. De
      # hostnaam is kleingeschreven, het pad houdt de schrijfwijze van de repo.
      - name: Stel de Pages-URL samen
        id: url
        run: |
          eigenaar=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "page_url=https://${eigenaar}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
      - run: npm run test:e2e
        env:
          PAGE_URL: ${{ steps.url.outputs.page_url }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          # test-results bevat de traces; playwright-report de html-rapportage.
          path: |
            playwright-report
            test-results
          if-no-files-found: error
          retention-days: 7
